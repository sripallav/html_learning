<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors - HEX, RGB, HSL</title>

    <style>
        .hex {
            background-color: #3498db;
            color: white;
            padding: 20px;
            margin: 10px;
        }

        .rgb {
            background-color: rgb(52, 152, 219);
            color: white;
            padding: 20px;
            margin: 10px;
        }

        .hsl {
            background-color: hsl(204, 70%, 53%);
            color: white;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Color Formats</h1>

    <div class="hex">
        HEX Color: #3498db
    </div>

    <div class="rgb">
        RGB Color: rgb(52, 152, 219)
    </div>

    <div class="hsl">
        HSL Color: hsl(204, 70%, 53%)
    </div>

</body>
</html>
