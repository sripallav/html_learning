<!DOCTYPE html>
<html>
<head>
    <title>Box Animation</title>

    <style>

        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: relative;

            animation-name: boxmove;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }

        @keyframes boxmove {

            0% {
                left: 0px;
                background-color: blue;
            }

            25% {
                left: 100px;
                background-color: red;
            }

            50% {
                left: 200px;
                background-color: green;
            }

            75% {
                left: 300px;
                background-color: orange;
            }

            100% {
                left: 0px;
                background-color: purple;
            }

        }

    </style>
</head>

<body>

    <h2>CSS Animation Example</h2>

    <div class="box"></div>

</body>
</html>
