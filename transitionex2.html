<!DOCTYPE html>
<html>
<head>
    <title>Box Breaking Animation</title>

    <style>

        .container {
            width: 200px;
            height: 200px;
            position: relative;
            margin: 100px;
        }

        .box {
            width: 100%;
            height: 100%;
            background-color: blue;
            position: absolute;
        }

        .small {
            width: 50%;
            height: 50%;
            position: absolute;
            background-color: red;
            transition: all 1s;
        }

        .one {
            top: 0;
            left: 0;
        }

        .two {
            top: 0;
            right: 0;
        }

        .three {
            bottom: 0;
            left: 0;
        }

        .four {
            bottom: 0;
            right: 0;
        }

        .container:hover .one {
            transform: translate(-80px, -80px);
        }

        .container:hover .two {
            transform: translate(80px, -80px);
        }

        .container:hover .three {
            transform: translate(-80px, 80px);
        }

        .container:hover .four {
            transform: translate(80px, 80px);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="small one"></div>
        <div class="small two"></div>
        <div class="small three"></div>
        <div class="small four"></div>

    </div>

</body>
</html>
